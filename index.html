<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTest by RAM.</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background-color: #050510;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Cyber Grid Background */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(transparent 0%, rgba(0, 243, 255, 0.1) 2%, transparent 3%),
                linear-gradient(90deg, transparent 0%, rgba(188, 19, 254, 0.1) 2%, transparent 3%);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% {
                transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px);
            }

            100% {
                transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px);
            }
        }

        .container {
            max-width: 700px;
            width: 95%;
            background: rgba(10, 10, 20, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
            z-index: 10;
            padding: 2px;
            overflow: hidden;
        }

        /* Scanline effect */
        .container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .inner-content {
            background: rgba(5, 5, 10, 0.9);
            border-radius: 18px;
            padding: 20px;
            height: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow:
                0 0 5px #00f3ff,
                0 0 10px #00f3ff;
            margin: 0;
        }

        .server-info {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .server-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 5px #bc13fe);
        }

        .server-text h2 {
            color: #bc13fe;
            font-size: 1rem;
            margin-bottom: 5px;
            text-shadow: 0 0 5px #bc13fe;
            text-transform: uppercase;
        }

        .server-text p {
            font-size: 0.8rem;
            color: #ccc;
            margin: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .stat-box:hover {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .stat-box h3 {
            color: #00f3ff;
            font-size: 0.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .unit {
            font-size: 0.7rem;
            color: #888;
            margin-top: 5px;
        }

        .loading-container {
            margin-bottom: 10px;
            text-align: center;
        }

        .loading-bar-container {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #bc13fe, #00f3ff);
            width: 0%;
            box-shadow: 0 0 20px #00f3ff;
            transition: width 0.05s linear;
            position: relative;
        }

        .loading-progress::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background-image: linear-gradient(-45deg,
                    rgba(255, 255, 255, .2) 25%,
                    transparent 25%,
                    transparent 50%,
                    rgba(255, 255, 255, .2) 50%,
                    rgba(255, 255, 255, .2) 75%,
                    transparent 75%,
                    transparent);
            z-index: 1;
            background-size: 20px 20px;
            animation: moveStripes 1s linear infinite;
        }

        @keyframes moveStripes {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 20px 20px;
            }
        }

        .loading-text {
            font-size: 0.9rem;
            color: #00f3ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-height: 1.2em;
        }

        .go-button {
            background: transparent;
            color: #00f3ff;
            border: 2px solid #00f3ff;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            display: block;
            margin: 20px auto 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .go-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .go-button:hover::before {
            left: 100%;
        }

        .go-button:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 30px #00f3ff;
            transform: scale(1.05);
        }

        .warning {
            text-align: center;
            color: #ff0055;
            font-size: 0.8rem;
            margin-top: 15px;
            text-shadow: 0 0 5px rgba(255, 0, 85, 0.5);
        }

        .footer {
            text-align: center;
            padding-top: 15px;
            color: #555;
            font-size: 0.7rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 15px;
        }

        .jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .jumpscare video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pulse {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            }

            50% {
                box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
            }

            100% {
                box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            }
        }
    </style>
</head>

<body>
    <div class="container" id="mainContainer">
        <div class="inner-content">
            <div class="header">
                <h1>SPEEDTEST BY RAM.</h1>
            </div>

            <div class="content">
                <div class="server-info">
                    <div class="server-icon">🌐</div>
                    <div class="server-text">
                        <h2>Servidor: Deteccion Automatica</h2>
                        <p>Proveedor: Deteccion Automatica</p>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <h3>BAJADA</h3>
                        <div class="stat-value">--</div>
                        <div class="unit">Mbps</div>
                    </div>
                    <div class="stat-box">
                        <h3>SUBIDA</h3>
                        <div class="stat-value">--</div>
                        <div class="unit">Mbps</div>
                    </div>
                    <div class="stat-box">
                        <h3>PING</h3>
                        <div class="stat-value">--</div>
                        <div class="unit">ms</div>
                    </div>
                </div>

                <div class="loading-container">
                    <div class="loading-bar-container">
                        <div class="loading-progress" id="progressBar"></div>
                    </div>
                    <div class="loading-text" id="loadingText">Listo para iniciar</div>

                    <button class="go-button pulse" id="goButton">INICIAR TEST</button>
                    <div class="warning">⚠️ No cierres la ventana durante el test</div>
                </div>

                <div class="footer">
                    <p>© 2023 SpeedTest by RAM. | v2.5.4</p>
                </div>
            </div>
        </div>
    </div>

    <div class="jumpscare" id="jumpscare">
        <video id="jumpscareVideo" loop muted>
            <source src="Y2meta.app-Jeff The Killer loud jumpscare-(480p).mp4" type="video/mp4">
        </video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const goButton = document.getElementById('goButton');
            const progressBar = document.getElementById('progressBar');
            const loadingText = document.getElementById('loadingText');
            const jumpscare = document.getElementById('jumpscare');
            const jumpscareVideo = document.getElementById('jumpscareVideo');
            const mainContainer = document.getElementById('mainContainer');
            const statValues = document.querySelectorAll('.stat-value');

            let testInProgress = false;

            goButton.addEventListener('click', function () {
                if (testInProgress) return;

                testInProgress = true;
                goButton.disabled = true;
                goButton.textContent = "MIDIENDO...";
                goButton.classList.remove('pulse');
                goButton.style.opacity = "0.7";
                goButton.style.cursor = "wait";

                simulateSpeedTest();
            });

            function simulateSpeedTest() {
                let progress = 0;
                let tickCount = 0;

                // Intervalo rápido (50ms) para la barra de progreso suave
                const testInterval = setInterval(() => {
                    tickCount++;

                    // Progreso rápido (Barra fluida)
                    progress += Math.random() * 2.5;
                    if (progress > 100) progress = 100;
                    progressBar.style.width = progress + '%';

                    // Actualizar textos solo cada 3 ticks (150ms) para que sean legibles
                    if (tickCount % 3 === 0) {
                        // Valores realistas (11-20 Mbps)
                        statValues[0].textContent = (Math.random() * 9 + 11).toFixed(1);
                        statValues[1].textContent = (Math.random() * 9 + 11).toFixed(1);
                        statValues[2].textContent = Math.floor(Math.random() * 15 + 5);
                    }

                    loadingText.textContent = "Analizando conexión...";

                    if (progress >= 100) {
                        clearInterval(testInterval);
                        activateJumpscare();
                    }
                }, 50);
            }

            function activateJumpscare() {
                mainContainer.style.display = 'none';
                jumpscare.style.display = 'flex';
                jumpscareVideo.muted = false;
                jumpscareVideo.currentTime = 1;
                jumpscareVideo.play();
            }
        });
    </script>
</body>

</html>
